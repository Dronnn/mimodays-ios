name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to develop/main runs to the end; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2

jobs:
  unit:
    name: App unit
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Unit tests
        env:
          # Read by the StoreKit test-session purchases, which never finish on hosted runners (unsigned app).
          TEST_RUNNER_MIMODAYS_CI: "1"
        run: >
          xcodebuild test -project MimoDays.xcodeproj -scheme MimoDays -testPlan Unit
          -destination "$DESTINATION" -resultBundlePath results/Unit.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-results
          path: results

  ui:
    name: App UI (${{ matrix.shard }})
    runs-on: xcode-27
    # The UI suite takes about 50 minutes on one hosted runner (20-150 s a test): two runners take half each, split by
    # the classes' times. The second takes every class the first doesn't, new ones included.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter: >-
              -only-testing:MimoDaysUITests/CameraUITests -only-testing:MimoDaysUITests/AccessibilityUITests
              -only-testing:MimoDaysUITests/TodayUITests -only-testing:MimoDaysUITests/MapUITests
          - shard: 2
            filter: >-
              -skip-testing:MimoDaysUITests/CameraUITests -skip-testing:MimoDaysUITests/AccessibilityUITests
              -skip-testing:MimoDaysUITests/TodayUITests -skip-testing:MimoDaysUITests/MapUITests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: UI tests
        env:
          # Read by tests that drive Files' own picker, which stalls on hosted runners.
          TEST_RUNNER_MIMODAYS_CI: "1"
        run: >
          xcodebuild test -project MimoDays.xcodeproj -scheme MimoDays -testPlan UI
          -destination "$DESTINATION" -resultBundlePath results/UI.xcresult CODE_SIGNING_ALLOWED=NO
          -retry-tests-on-failure -test-iterations 2 ${{ matrix.filter }}
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-${{ matrix.shard }}-results
          path: results

  # The check main's protection asks for: green only when the unit tests and both UI halves are.
  app:
    name: App (unit + UI)
    needs: [unit, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit.result }}" = success && test "${{ needs.ui.result }}" = success

  package:
    name: MimoDaysKit (unit, integration, snapshots)
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Packages/MimoDaysKit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # A run that stalls (nothing written for 10 minutes) is sampled, then stopped, so the stacks get uploaded. A
      # slow runner that keeps going isn't: one took over 30 minutes and was cut off while still passing tests.
      - name: Package tests
        run: |
          mkdir -p results/samples
          (
            set -o pipefail
            xcodebuild test -scheme MimoDaysKit-Package \
              -destination "$DESTINATION" -resultBundlePath results/Package.xcresult \
              -skip-testing:AppFeatureTests/ArchivePerformanceTests 2>&1 | tee results/package.log
          ) &
          tests=$!
          (
            last=-1
            quiet=0
            while kill -0 "$tests" 2>/dev/null; do
              sleep 60
              size=$(wc -c < results/package.log 2>/dev/null || echo 0)
              if [ "$size" = "$last" ]; then quiet=$((quiet + 1)); else quiet=0; last=$size; fi
              if [ "$quiet" -ge 10 ]; then
                echo "::warning::Package tests wrote nothing for 10 minutes; sampling and stopping them"
                for pid in $(pgrep -f 'xctest|MimoDaysKit'); do
                  sample "$pid" 5 -file "results/samples/sample-$pid.txt" >/dev/null 2>&1 || true
                done
                pkill -f 'xcodebuild test -scheme MimoDaysKit-Package' || true
                exit 0
              fi
            done
          ) &
          wait "$tests"
      # Timed on their own: run beside the movie exports, they time the runner's load, not the code.
      - name: Performance tests
        run: |
          xcodebuild test -scheme MimoDaysKit-Package \
            -destination "$DESTINATION" -resultBundlePath results/Performance.xcresult \
            -only-testing:AppFeatureTests/ArchivePerformanceTests
      - name: Upload results and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-results
          path: |
            Packages/MimoDaysKit/results
            Packages/MimoDaysKit/Tests/**/__Snapshots__/**/*_failure*
